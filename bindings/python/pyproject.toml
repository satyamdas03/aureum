[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aureum"
version = "0.1.0"
description = "Python bindings and developer API for the Aureum semantic kernel."
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.2",
]

[project.scripts]
aureum = "aureum.cli:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["aureum"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aureum*"]
