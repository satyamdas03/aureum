[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aureum"
version = "0.3.0"
description = "Python bindings and developer API for the Aureum semantic kernel."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "click>=8.1.0",
    "anthropic>=0.40.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.2",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
aureum = "aureum.cli:main"

[tool.ruff]
target-version = "py311"
src = ["."]

[tool.ruff.lint.isort]
known-first-party = ["aureum"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "networkx.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["aureum*"]
