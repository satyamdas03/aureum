# Example Aureum strategy using split-conformal prediction sets for portfolio
# construction.  The optimizer runs mean-variance on conservative lower-bound
# expected returns produced by split conformal inference with 95% marginal
# coverage over the calibration window.

apiVersion: aureum.io/v1alpha1
kind: Strategy
metadata:
  name: conformal-mean-variance-tech
  description: |
    Long-only conformalized mean-variance portfolio of US tech stocks,
    rebalanced monthly with 95% split-conformal coverage and a 40% single-name cap.
  tags: [mpt, conformal, mean-variance, tech]

spec:
  universe:
    source: sp500
    filter:
      sector: Technology
      min_price: 5.00
      min_adv20: 1_000_000

  schedule:
    rebalance: 1M
    lookback: 252d

  portfolio:
    objective: conformalized_portfolio
    base_objective: mean_variance
    uncertainty:
      method: conformal_split
      coverage: 0.95
      calibration_fraction: 0.20
    target_return: 0.001
    risk_measure: variance
    covariance_estimator: sample
    risk_free_rate: 0.0
    lookback_days: 252
    long_only: true
    max_weight: 0.40
    min_weight: 0.00

  risk:
    max_drawdown:
      value: 0.30
      hard: true
    max_leverage:
      value: 1.00
      hard: true
    max_turnover_annual:
      value: 20.00
      hard: false
    max_concentration_single_name:
      value: 0.40
      hard: true

  execution:
    open: market_on_open
    slippage: 0.0005

  audit:
    lineage: full
    deterministic: true
