name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build Rust workspace
        run: cargo build --workspace
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python package and dev deps
        run: pip install -e "bindings/python[dev]"
      - name: Lint Python
        run: ruff check bindings/python
      - name: Type check Python
        run: mypy bindings/python
      - name: Test Python
        run: pytest bindings/python

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install frontend deps
        run: cd frontend/web && npm ci
      - name: Lint frontend
        run: cd frontend/web && npm run lint
      - name: Build frontend
        run: cd frontend/web && npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs deps
        run: pip install mkdocs-material
      - name: Build docs
        run: mkdocs build --strict
